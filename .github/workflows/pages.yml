name: Build unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List schemes
        working-directory: ios
        run: |
          ls -la
          xcodebuild -list -project *.xcodeproj || true

      - name: Build unsigned .app
        working-directory: ios
        run: |
          set -e
          PROJ=$(ls -d *.xcodeproj | head -n1)
          echo "Using project: $PROJ"
          SCHEME=$(xcodebuild -list -project "$PROJ" -json \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['project']['schemes'][0])")
          echo "Using scheme: $SCHEME"

          xcodebuild \
            -project "$PROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -e
          APP=$(find "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos" -maxdepth 1 -name "*.app" | head -n1)
          echo "App: $APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "OpenTVRemote-unsigned.ipa" Payload
          ls -la

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenTVRemote-unsigned-ipa
          path: ${{ runner.temp }}/ipa/OpenTVRemote-unsigned.ipa
          retention-days: 7
